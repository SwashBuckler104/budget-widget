# The PennyWise submodule is deliberately not listed: it is bumped by hand after review
# (docs/PARSER_UPGRADE.md).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
    ignore:
      # Pinned to match upstream parser-core; bumped together with the submodule.
      - dependency-name: org.jetbrains.kotlinx:kotlinx-datetime
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check submodule is at the pinned commit
        # `git submodule status` prefixes '+' (other commit) or '-' (not checked out).
        run: |
          git submodule status
          ! git submodule status | grep -qE '^[+-]'

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source (MIT) cache provider; see docs/DECISIONS.md ADR-0009.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Spotless, lint, unit tests (incl. upstream parser suite), debug + release APKs
        run: ./gradlew spotlessCheck lint test assembleDebug assembleRelease --console=plain

      - name: Check APK permissions (no INTERNET, allowlist only)
        run: >
          scripts/check-permissions.sh
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Check parser module boundary
        run: scripts/check-module-boundaries.sh

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation (Sigstore, keyless)
      attestations: write # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # v<versionName> is a release; v<versionName>-rcN is a pre-release build of it (same signing
      # key, installs over the current version, never shown as "Latest").
      - name: Check tag matches versionName
        run: |
          version="$(sed -n 's/^budgetwidget\.versionName=//p' gradle.properties)"
          if [[ "${GITHUB_REF_NAME}" == "v${version}" ]]; then
            echo "PRERELEASE_FLAG=" >> "${GITHUB_ENV}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v${version//./\\.}-rc[0-9]+$ ]]; then
            echo "PRERELEASE_FLAG=--prerelease" >> "${GITHUB_ENV}"
          else
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${version} (or ${version}-rcN)" >&2
            exit 1
          fi

      # AGPL-3.0: the complete corresponding source, including the parser-core submodule, which
      # GitHub's own tag archives leave out. Made before the build, so it holds no build output.
      - name: Source archive (with submodules)
        run: |
          name="budget-widget-${GITHUB_REF_NAME}-source"
          tar --exclude-vcs --transform "s,^\.,${name}," -czf "${RUNNER_TEMP}/${name}.tar.gz" .

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          # Releases build from a clean cache state; never write a cache from a tag build.
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          keystore="${RUNNER_TEMP}/release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          echo "KEYSTORE_PATH=${keystore}" >> "${GITHUB_ENV}"

      - name: Test and build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # No configuration cache: keep signing secrets out of on-disk cache entries entirely.
        run: ./gradlew test assembleRelease --console=plain --no-configuration-cache

      - name: Check APK permissions (no INTERNET, allowlist only)
        run: scripts/check-permissions.sh app/build/outputs/apk/release/app-release.apk

      - name: Check release APK (not debuggable, no network code)
        run: scripts/check-release-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Check every view model is in the Hilt component
        run: scripts/check-hilt-viewmodels.sh release

      - name: Check R8 kept what libraries create by reflection
        run: scripts/check-release-reflection.sh app/build/outputs/apk/release/app-release.apk

      - name: Verify signature and prepare assets
        run: |
          apksigner="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)/apksigner"
          "${apksigner}" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          # One APK under a fixed name, so releases/latest/download/budget-widget.apk always
          # serves the newest version (the README's one-tap download link).
          cp app/build/outputs/apk/release/app-release.apk dist/budget-widget.apk
          cp "${RUNNER_TEMP}/budget-widget-${GITHUB_REF_NAME}-source.tar.gz" dist/
          (cd dist && sha256sum budget-widget.apk > budget-widget.apk.sha256)
          cat dist/*.sha256

      # SLSA build provenance (ADR-0050): a signed statement that this workflow, at this commit,
      # built these exact files. Check with
      # `gh attestation verify budget-widget.apk -R SwashBuckler104/budget-widget`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/budget-widget.apk
            dist/budget-widget-${{ github.ref_name }}-source.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --title "Budget Widget ${GITHUB_REF_NAME#v}"
          --notes-file "fastlane/metadata/android/en-US/changelogs/$(sed -n 's/^budgetwidget\.versionCode=//p' gradle.properties).txt"
          --generate-notes
          --verify-tag
          ${PRERELEASE_FLAG}

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

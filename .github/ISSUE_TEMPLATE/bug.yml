name: Bug report
description: Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste unredacted SMS or screenshots with real account data.**
        For an SMS the app doesn't recognise, use the "Bank SMS format" template instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Redmi Note 13, Android 14 (HyperOS 1.0)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SMS detection / parsing
        - Notifications
        - Quick-Sort widget
        - Insight widget
        - Transactions
        - Analysis
        - Categories
        - Settings / backup
        - Install / permissions
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, redacted screenshots, battery settings, whether the app was killed, etc.

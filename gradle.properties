org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# Single source of truth for the Java package root and the applicationId.
# Module namespaces are derived from it by the convention plugins (e.g. <root>.core.model).
# The applicationId is permanent once installed; see docs/DECISIONS.md (ADR-0003).
budgetwidget.packageRoot=io.github.swashbuckler104.budgetwidget

# App version. release.yml checks that the pushed tag equals v<versionName>.
budgetwidget.versionName=1.0.1
budgetwidget.versionCode=3

# Incremental KSP once dropped a module's generated Hilt modules from the release build while the
# task stayed up to date, producing an APK that crashed on start (docs/DECISIONS.md ADR-0029).
# Full KSP runs cost a few seconds; scripts/check-hilt-viewmodels.sh guards the result in CI.
ksp.incremental=false
